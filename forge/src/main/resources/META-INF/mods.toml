modLoader="javafml"
loaderVersion="[46,)"
license="CC-NC-4.0"
issueTrackerURL="https://github.com/nicolesrt/VersionTooltips"

[[mods]]
modId="versiontooltips"
version="${version}"
displayName="Version Tooltips"
description='''
        This mod adds a simple toggleable tooltip that shows in what version an item was added to the game.
    '''
authors="soldplace, Nicole.srt"
logoFile="versiontooltipsicon128x128.png"

[[dependencies.versiontooltips]]
modId="minecraft"
mandatory = true
versionRange="[1.20.5,1.20.6]"
ordering="NONE"
side="BOTH"

[[dependencies.versiontooltips]]
modId="forge"
mandatory = true
versionRange="[50,)"
ordering="NONE"
side="BOTH"

[[dependencies.versiontooltips]]
modId="cloth_config"
mandatory = true
versionRange="[14.0.139,)"
ordering="BEFORE"
side="BOTH"

